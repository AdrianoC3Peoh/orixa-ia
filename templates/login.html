{% extends "base.html" %}
{% block title %}Entrar{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center px-4 py-16">
  <div class="w-full max-w-md animate-slide-up">
    <div class="text-center mb-8">
      <div class="text-5xl mb-4">🔮</div>
      <h1 class="font-cinzel font-bold text-3xl text-white mb-2">Bem-vindo de volta</h1>
      <p class="text-white/50">Continue sua jornada de autoconhecimento</p>
    </div>
    <div class="glass rounded-2xl p-8">
      <div id="erro" class="hidden mb-4 bg-red-500/20 border border-red-500/30 text-red-300 text-sm px-4 py-3 rounded-xl"></div>
      <form id="formLogin" class="space-y-5">
        <div>
          <label class="block text-white/70 text-sm font-medium mb-2">E-mail</label>
          <input id="email" type="email" required placeholder="seu@email.com"
            class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white placeholder-white/30 focus:outline-none focus:border-mystic-500 transition-colors" />
        </div>
        <div>
          <label class="block text-white/70 text-sm font-medium mb-2">Senha</label>
          <input id="senha" type="password" required placeholder="Sua senha"
            class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white placeholder-white/30 focus:outline-none focus:border-mystic-500 transition-colors" />
        </div>
        <button type="submit" id="btnSubmit"
          class="btn-primary w-full text-white py-3 rounded-xl font-semibold text-base mt-2 flex items-center justify-center gap-2">
          <span id="btnText">Entrar</span>
          <span id="btnLoader" class="hidden w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
        </button>
      </form>
      <p class="text-center text-white/40 text-sm mt-6">
        Não tem conta? <a href="/cadastro" class="text-mystic-400 hover:text-mystic-300 transition-colors">Criar conta grátis</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
document.getElementById('formLogin').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('btnSubmit');
  const loader = document.getElementById('btnLoader');
  const text = document.getElementById('btnText');
  const erro = document.getElementById('erro');
  erro.classList.add('hidden');
  btn.disabled = true; loader.classList.remove('hidden'); text.textContent = 'Entrando...';
  try {
    const data = await apiFetch('/api/auth/login', {
      method: 'POST',
      body: JSON.stringify({
        email: document.getElementById('email').value,
        senha: document.getElementById('senha').value,
      })
    });
    salvarToken(data.token);
    window.location.href = data.redirect || '/dashboard';
  } catch(err) {
    showError(erro, err.message);
    btn.disabled = false; loader.classList.add('hidden'); text.textContent = 'Entrar';
  }
});
</script>
{% endblock %}
