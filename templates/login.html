{% extends "base.html" %}
{% block title %}Entrar{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center px-4 py-16">
  <div class="w-full max-w-md animate-slide-up">
    <div class="text-center mb-8">
      <span class="ornament text-4xl block mb-4">✦</span>
      <h1 class="font-cinzel font-bold text-3xl text-terra-800 mb-2">Bem-vindo de volta</h1>
      <p class="text-terra-500">Continue sua jornada de autoconhecimento</p>
    </div>
    <div class="glass rounded-2xl p-8">
      <div id="erro" class="hidden mb-4 bg-red-50 border border-red-200 text-red-700 text-sm px-4 py-3 rounded-xl"></div>

      <!-- Google OAuth -->
      <a href="/auth/google"
        class="flex items-center justify-center gap-3 w-full border border-terra-200 bg-white hover:bg-terra-50 text-terra-800 py-3 rounded-xl font-medium text-sm transition-all mb-5 shadow-sm">
        <svg width="18" height="18" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M43.611 20.083H42V20H24v8h11.303C33.654 32.657 29.332 36 24 36c-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z" fill="#FFC107"/>
          <path d="M6.306 14.691l6.571 4.819C14.655 15.108 19.001 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z" fill="#FF3D00"/>
          <path d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238C29.211 35.091 26.715 36 24 36c-5.316 0-9.831-3.589-11.427-8.562l-6.548 5.036C9.505 39.556 16.227 44 24 44z" fill="#4CAF50"/>
          <path d="M43.611 20.083H42V20H24v8h11.303c-.792 2.237-2.231 4.166-4.087 5.571l6.19 5.238C42.022 35.245 44 30 44 24c0-1.341-.138-2.65-.389-3.917z" fill="#1976D2"/>
        </svg>
        Continuar com Google
      </a>

      <div class="flex items-center gap-3 mb-5">
        <div class="flex-1 h-px bg-terra-200"></div>
        <span class="text-terra-400 text-xs">ou</span>
        <div class="flex-1 h-px bg-terra-200"></div>
      </div>

      <form id="formLogin" class="space-y-5">
        <div>
          <label class="block text-terra-700 text-sm font-medium mb-2">E-mail</label>
          <input id="email" type="email" required placeholder="seu@email.com"
            class="w-full bg-terra-50 border border-terra-200 rounded-xl px-4 py-3 text-terra-800 placeholder-terra-400 focus:outline-none focus:border-terra-500 transition-colors" />
        </div>
        <div>
          <label class="block text-terra-700 text-sm font-medium mb-2">Senha</label>
          <input id="senha" type="password" required placeholder="Sua senha"
            class="w-full bg-terra-50 border border-terra-200 rounded-xl px-4 py-3 text-terra-800 placeholder-terra-400 focus:outline-none focus:border-terra-500 transition-colors" />
        </div>
        <button type="submit" id="btnSubmit"
          class="btn-primary w-full text-white py-3 rounded-xl font-semibold text-base mt-2 flex items-center justify-center gap-2">
          <span id="btnText">Entrar</span>
          <span id="btnLoader" class="hidden w-5 h-5 border-2 border-white/40 border-t-white rounded-full animate-spin"></span>
        </button>
      </form>
      <p class="text-center text-terra-500 text-sm mt-6">
        Não tem conta? <a href="/cadastro" class="text-terra-600 hover:text-terra-500 font-medium transition-colors underline underline-offset-2">Criar conta grátis</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
document.getElementById('formLogin').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('btnSubmit');
  const loader = document.getElementById('btnLoader');
  const text = document.getElementById('btnText');
  const erro = document.getElementById('erro');
  erro.classList.add('hidden');
  btn.disabled = true; loader.classList.remove('hidden'); text.textContent = 'Entrando...';
  try {
    const data = await apiFetch('/api/auth/login', {
      method: 'POST',
      body: JSON.stringify({
        email: document.getElementById('email').value,
        senha: document.getElementById('senha').value,
      })
    });
    salvarToken(data.token);
    window.location.href = data.redirect || '/dashboard';
  } catch(err) {
    showError(erro, err.message);
    btn.disabled = false; loader.classList.add('hidden'); text.textContent = 'Entrar';
  }
});
</script>
{% endblock %}
